services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: HotelManagementDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./HMS/HMS.API
      dockerfile: Dockerfile
    ports:
      - "7172:7172"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=HotelManagementDB;Username=postgres;Password=postgres123
      - JwtSettings__SecretKey=HMS_SuperSecretKey_2025_MustBe32CharsLong!
      - JwtSettings__Issuer=HMS.API
      - JwtSettings__Audience=HMS.Client
      - JwtSettings__ExpiryMinutes=15
      - ASPNETCORE_URLS=http://+:7172
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./hms-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data: